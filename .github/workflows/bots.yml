name: Service Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: |
          TOKEN_A="${{ secrets.TOKEN_A }}" python3 svc-a/bot.py &
          TOKEN_B="${{ secrets.TOKEN_B }}" python3 svc-b/bot.py &
          wait
